<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Adventure's Handbook</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>The Adventurer's Handbook</h1>

  <p>
    Welcome to The Adventurer's Handbook!
    Organize topics to help you learn the basics of Dungeons and Dragons.
  </p>

  <div class="add-box">
    
    
    <label for="title-input">Topic Name:</label>
    <input type="text" id="title-input" placeholder="Type a new D&D topic...">

    <!--Category field, added this to create a new label and section to spiff up the project-->
    <label for="category-input">Choose a Category:</label>
    <select id="category-input">
      <option value="">Choose a category</option>
      <option value="Game Basics">Game Basics</option>
      <option value="Character Creation">Character Creation</option>
      <option value="Gameplay">Gameplay</option>
    </select>

    
    <button onclick="addItem()">Add</button> <!--Gives a nice little button to use-->
  </div>

  
  <ul id="item-list"></ul>

  
  
    <footer id="adventureFooter">
        <p>© 2026 The Adventurer's Handbook</p>
    </footer>
    
  <script src="app.js"></script>
</body>
</html>
